services:
  mysql:
    image: mysql:latest   # 复用本地已有镜像（health160 同款），不再额外下载
    container_name: aws-ssa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: aws_ssa_root
      MYSQL_DATABASE: aws_ssa
      MYSQL_USER: aws_ssa
      MYSQL_PASSWORD: aws_ssa_pass
    ports:
      - "3307:3306"   # 避开 health160 项目的 some-mysql（3306）
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
