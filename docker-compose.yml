services:
  mysql:
    image: mysql:8.4
    container_name: aws-ssa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: aws_ssa_root
      MYSQL_DATABASE: aws_ssa
      MYSQL_USER: aws_ssa
      MYSQL_PASSWORD: aws_ssa_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
